apiVersion: apps/v1
kind: Deployment
metadata:
  name: hath0r-poc
  namespace: hath0r-poc
  labels:
    app.kubernetes.io/name: hath0r-poc
    app.kubernetes.io/managed-by: hath0r
    fargate: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hath0r-poc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hath0r-poc
        fargate: "true"
    spec:
      serviceAccountName: hath0r-poc-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: hath0r-poc
          image: 711387127111.dkr.ecr.us-east-1.amazonaws.com/hath0r-poc@sha256:8c3ceb235d12e31d1d81842b25685ea3b9e3f8208e8cf732bea75a17b660c04b
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp-volume
          emptyDir: {}
