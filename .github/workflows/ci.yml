# POC CI — lint, typecheck, unit+integration, build, Playwright e2e
# Smoke tests (real hath0r) are intentionally excluded from CI.

name: CI

on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened]
  push:
    branches: [development]

concurrency:
  group: ci-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (format, lint, typecheck, unit, integration, build)
        run: npm run check

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: "true"
          POC_API_HOST: "localhost"
          POC_API_PORT: "3001"
          POC_E2E_CLIENT_PORT: "5173"
